services:
  # Database for the API
  postgres:
    image: postgres:14.1
    # Note: Volume paths updated to point inside the server/ subdirectory
    volumes:
      - ./server/res/docker_mounts/:/var/lib/postgres/data
      - ./server/res/data.sql/:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The main application (Includes API and Client served via NestJS)
  api:
    image: ecommerce-demo:1.0
    # Context updated to root (.) so it can access both client/ and server/
    build:
      context: .
      target: dev # Switch to 'prod' for the production build stage
    env_file:
      - .env
    environment:
        DB_HOST: postgres
        DB_PORT: 5432
        DB_PASS: postgres
        DATABASE: bookstore
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        # Delays API startup until Postgres is fully ready to accept connections
        condition: service_healthy
