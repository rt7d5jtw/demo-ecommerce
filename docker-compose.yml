services:
  # Database for the API
  postgres:
    image: postgres:14.1
    volumes:
      - ./server/res/docker_mounts/:/var/lib/postgres/data
      - ./server/res/data.sql/:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookstore
      POSTGRES_PORT: 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The main application
  api:
    image: ecommerce-demo:1.0
    build:
      context: .
      target: prod 
    env_file:
      - path: .env
        required: false
    environment:
        HOST: "0.0.0.0"
        PORT: 3000
        DB_HOST: postgres
        DB_USER: postgres
        DB_PORT: 5432
        DB_PASS: postgres
        DATABASE: bookstore
        DB_SYNC: true
        DB_LOGGING: true
        JWT_SECRET: putyourownjwtsecrethere
        JWT_EXPIRATION: 3600
        STRIPE_SECRET: putyourstripesecrethere
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
